name: _build
run-name: Build

on:
  workflow_call:
    inputs:
      release_version:
        description: Release version; empty for pull-request verification.
        required: false
        type: string
        default: ""
      upload_debug_apk:
        description: Upload the debug APK after a successful verification build.
        required: false
        type: boolean
        default: false
    secrets:
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEYSTORE_BASE64:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Validate release signing secrets
        if: inputs.release_version != ''
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          missing=()
          for secret_name in KEY_ALIAS KEY_PASSWORD KEYSTORE_PASSWORD KEYSTORE_BASE64; do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("$secret_name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing release signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Verify pull request
        if: inputs.release_version == ''
        run: ./gradlew ktlintCheck check assembleDebug
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}

      - name: Upload debug APK
        if: inputs.release_version == '' && inputs.upload_debug_apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karoo-hass-companion-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release
        if: inputs.release_version != ''
        run: ./gradlew ktlintCheck check assembleRelease
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          REQUIRE_RELEASE_SIGNING: "true"
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Rename release APK
        if: inputs.release_version != ''
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/karoo-hass-companion.apk

      - name: Upload release APK
        if: inputs.release_version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karoo-hass-companion.apk
          path: app/build/outputs/apk/release/karoo-hass-companion.apk
          if-no-files-found: error
