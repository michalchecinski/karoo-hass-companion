name: _build
run-name: Build

on:
  workflow_call:
    inputs:
      release_version:
        description: Release version; empty for pull-request verification.
        required: false
        type: string
        default: ""
    secrets:
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEYSTORE_BASE64:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Validate release signing secrets
        if: inputs.release_version != ''
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          missing=()
          for secret_name in KEY_ALIAS KEY_PASSWORD KEYSTORE_PASSWORD KEYSTORE_BASE64; do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("$secret_name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing release signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Verify pull request
        if: inputs.release_version == ''
        run: ./gradlew ktlintCheck check assembleDebug
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}

      - name: Build signed release
        if: inputs.release_version != ''
        run: ./gradlew ktlintCheck check assembleRelease
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          REQUIRE_RELEASE_SIGNING: "true"
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Rename release APK
        if: inputs.release_version != ''
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/karoo-hass-companion.apk

      - name: Upload release APK
        if: inputs.release_version != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: karoo-hass-companion.apk
          path: app/build/outputs/apk/release/karoo-hass-companion.apk
          if-no-files-found: error
